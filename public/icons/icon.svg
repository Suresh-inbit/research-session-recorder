<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="64" rx="30" fill="url(#shine)"/>
  <!-- lens ring, open at the upper right where the orbiting marker sits -->
  <path d="M 90.2 33.8 A 40 40 0 1 0 102 64" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <!-- record dot -->
  <circle cx="64" cy="64" r="15" fill="#fff"/>
  <!-- orbiting marker -->
  <circle cx="98" cy="30" r="9" fill="#fff"/>
  <circle cx="98" cy="30" r="4" fill="#06b6d4"/>
</svg>
